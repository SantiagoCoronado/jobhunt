# Your targeting on top of config/sources.yaml. Copy to `sources.local.yaml`
# (`python -m src.init` does it) and uncomment what you want; the file is git-ignored.
#
# How it merges (src/config.py `sources()`): each top-level key here is one source block from
# config/sources.yaml. Lists REPLACE the tracked list, scalars OVERRIDE the tracked value,
# a source name that does not exist in sources.yaml is ADDED as a new block.
#
# Everything below is commented out on purpose. An unedited copy searches nowhere: a source
# with no targeting keys prints a hint and yields nothing. The values shown are for an
# invented candidate in Lisbon; replace them with yours.

# ---- ATS boards of companies you follow (highest-signal listings) --------------------
# greenhouse:
#   tokens: [examplecorp, ledgerly]          # https://boards.greenhouse.io/<token>
#   names: {examplecorp: "Example Corp"}     # display name when the token is not the name
# lever:
#   tokens: [examplecorp]                    # https://jobs.lever.co/<token>
# ashby:
#   tokens: [examplecorp]                    # https://jobs.ashbyhq.com/<token>

# ---- Geography and queries for the aggregators ----------------------------------------
# adzuna:                                    # needs ADZUNA_APP_ID / ADZUNA_APP_KEY in .env
#   countries: [gb, de, nl]                  # Adzuna country codes
#   queries: [frontend engineer, full stack engineer, react developer]
#   country_queries: {gb: [typescript engineer]}   # per-country extras, optional
# careerjet:                                 # needs CAREERJET_AFFID in .env
#   locale_code: en_GB
#   location: Remote
#   keywords: [frontend engineer, full stack engineer]
# torre:
#   queries: [frontend engineer, full stack engineer, react]
# remotive:
#   categories: [software-dev]
# jobicy:
#   tags: [frontend, javascript, react, typescript]

