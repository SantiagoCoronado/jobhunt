name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (core + dev; skips the heavy legacy renderer)
        run: |
          pip install requests==2.34.2 feedparser==6.0.12 PyYAML==6.0.3 flask==3.1.3 \
                      python-docx==1.2.0 rapidfuzz==3.14.5 apprise==1.11.0 \
                      pytest==9.1.1 ruff==0.15.22 mypy==2.3.0 types-requests types-PyYAML
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest)
        run: python -m pytest tests/ -q
