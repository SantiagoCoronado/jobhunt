# .github/workflows/claude-review.yml (lives on the default branch: issue_comment workflows run from there)
#
# Claude second-pass review. Review only: Claude cannot edit files or push.
# On a Cursor handoff, Claude posts findings in Linear and moves the issue
# back to Testing. Cursor makes the final pass or fail call.
#
# - Cursor hands off with a PR comment: "@claude Claude gate: PRA-123"
# - Anyone with write access can also comment "@claude ..." for an ad hoc
#   review. Ad hoc reviews never change Linear.
#
# Repo secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
#               LINEAR_API_KEY (Linear personal API key, used by the Linear MCP)

name: Claude second-pass review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  GATE_INSTRUCTIONS: >-
    You are the second reviewer for the PRAGMA Jobhunt repo. Cursor reviews
    every PR first. You never edit files, push commits, approve, merge, or
    change the PR description.

    MODE. If the comment that triggered you contains the text Claude gate:
    followed by a Linear issue id, run the GATE procedure for that issue.
    Otherwise do only the review the commenter asked for, reply on the PR
    mentioning the commenter, and do not change anything in Linear.

    GATE procedure. This is pull request number ${{ github.event.issue.number || github.event.pull_request.number }}. The local checkout
    may be on main, so read the PR only through gh commands for that number.
    1. Use the Linear tools to load the issue with its assignee, labels, and
    comments, including the latest Cursor review and any earlier Claude
    review.
    2. Read every existing comment on this PR with gh pr view. Review the
    full diff with gh pr diff, and read the matching docs/spec file for the
    issue. Cursor already ran ruff, mypy
    and pytest, so do not re-run them.
    3. Do not repeat Cursor findings. Focus on what Cursor missed: correctness
    bugs, regressions, missing tests, security issues, data handling, and
    misses against the issue spec. If an earlier Claude review listed
    findings, check whether each one is fixed.
    4. Post a Linear comment titled ## Claude review - ISSUE_ID with a short
    summary, a numbered list of findings each with a file path and marked
    Blocking or Suggestion (or the word None), your recommendation of pass
    or fail, and as the last line: Reviewed commit: FULL_HEAD_SHA, using the
    output of gh pr view with the PR number and the options
    --json headRefOid -q .headRefOid. Never use git rev-parse for this.
    5. Post the same summary as one PR comment with gh pr comment,
    mentioning the PR author.
    6. After the Linear comment is posted, move the issue to Testing,
    whatever your recommendation is. Cursor makes the final call. Do not
    change labels, and do not move it to any other status.
    7. Only change the issue named in the gate comment.

jobs:
  claude:
    if: |
      (github.event.issue.pull_request || github.event.pull_request) &&
      (contains(github.event.comment.body, '@claude') ||
       contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Login Cursor posts PR comments as. Check one of Cursor's comments.
          allowed_bots: "cursor,cursor[bot]"
          claude_args: |
            --model opus
            --mcp-config '{"mcpServers":{"linear":{"type":"http","url":"https://mcp.linear.app/mcp","headers":{"Authorization":"Bearer ${{ secrets.LINEAR_API_KEY }}"}}}}'
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git log:*),Bash(git diff:*),mcp__linear"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit"
            --append-system-prompt "${{ env.GATE_INSTRUCTIONS }}"
