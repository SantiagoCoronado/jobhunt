# How the TUI looks and opens (docs/spec-tui.md section 6). Written by the settings modal
# (`,` inside `python -m src.tui`), which rewrites the whole file: values edited by hand are
# kept, comments added by hand are not.

[theme]
name = "textual-dark"           # any Textual built-in or "kanagawa" (custom)

[sections]
default = "board"           # section opened on launch: board, followups
detail_pane = true          # false = always overlay

# No [harness] block: the harness and per-stage models live in config/hunt.toml
# (docs/spec-hunt-orchestrator.md section 6) and the settings modal edits that file.

[followups]
days = 5                    # display only; config.followup_days() stays the pipeline authority
overdue_style = "red"

[editor]
command = "code -w"         # $VARS expand; {file} marks where the path goes (appended when absent)
