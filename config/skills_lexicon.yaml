# Curated tech-term lexicon for src/gaps.py (spec 3a). Grows by hand.
# Each entry: term (canonical), optional aliases, category. Matching is
# case-insensitive on word boundaries; a term the lexicon lacks is simply not
# counted (the /jh-upskill LLM pass covers novel terms qualitatively).
# NOTE: "go" and "r" are deliberately absent as bare terms (hopelessly noisy in
# prose); golang covers the real signal.

terms:
