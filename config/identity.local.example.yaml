# Patterns the guard test (tests/test_no_user_data.py) refuses to find in tracked files:
# your name, your email addresses, your phone number, the old deliverable stem, anything
# that identifies you. Documentation only: `python -m src.init` never copies this file.
# To enable the identity rule, write config/identity.local.yaml by hand (git-ignored) with
# your own values. Without it the guard runs the path rule only, so a fresh clone stays green.
#
# The values below belong to the invented candidate in the example files.

patterns:
  - "Alex Example"
  - "alex@example.com"
  - "+351-900-000-000"
  - "AlexExampleResume"

# Lines under docs/ that match one of these regexes are allowed: dated attributions in specs.
attribution_regexes:
  - "\\(Alex, 20\\d\\d-"
  - "Alex \\+ Fable"
