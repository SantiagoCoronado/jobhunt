# ---------------------------------------------------------------------------
# Shared role-family title gate for the broad company ATS boards
# (greenhouse / lever / ashby / smartrecruiters / recruitee / bamboohr /
# personio / workday). Those boards hand back every open req a company has, so
# roughly half of what they returned was nursing, manufacturing, or sales, and
# each junk row costs a Haiku triage call. Terms match on WORD BOUNDARIES, so
# "ai" matches "AI Engineer" but not "Maintenance"; add hyphenated spellings
# explicitly. Titles only: location is never filtered here (config/profile.yaml
# `location_rule` is the single authority, and the matcher applies it).
# Per-source override: give that source its own `title_filter:` block, or
# `title_filter: {enabled: false}` to take everything.
# ---------------------------------------------------------------------------
title_filter:
  enabled: true
  # Dream companies (profile.yaml dream_companies) skip the gate entirely: their boards
  # are small (xAI 251, Riot 164) and the titles worth chasing there ("Member of Technical
  # Staff", "Head of Data Intelligence") are exactly the ones a keyword gate drops.
  skip_dream_companies: true
  include:
    # generic engineering
    - engineer
    - engineering
    - developer
    - development
    - programmer
    - architect
    - software
    - swe
    - technologist
    # Family A, AI / full stack
    - ai
    - a.i.
    - ml
    - llm
    - genai
    - "machine learning"
    - "deep learning"
    - "artificial intelligence"
    - "data science"
    - "data scientist"
    - "research scientist"
    - "full stack"
    - fullstack
    - "full-stack"
    - backend
    - "back-end"
    - "back end"
    - founding
    # Family B, deployment / enablement / solutions / GTM
    - solutions
    - solution
    - "forward deployed"
    - "forward-deployed"
    - deployment
    - strategist
    - enablement
    - adoption
    - transformation
    - gtm
    - "go-to-market"
    - "customer engineer"
    - "field engineer"
    - "technical account"
    - "technical program"
    - "technical product"
    - "technical lead"
    - "technical consultant"
    - consultant
    - "professional services"
    # Family C, frontend / web
    - frontend
    - "front-end"
    - "front end"
    - ui
    - ux
    - web
    - react
    - javascript
    - typescript
    - mobile
    - "design engineer"
    # Family D, internal tools / platform / devex
    - "internal tools"
    - "internal tooling"
    - "developer experience"
    - "developer productivity"
    - "developer relations"
    - devrel
    - devex
    - platform
    - infrastructure
    - infra
    - devops
    - sre
    - "site reliability"
    - automation
    - integrations
    - integration
    - "business systems"
    - "data engineer"
    - "analytics engineer"
    - python
    - node
    - "cloud engineer"
    - api
    # Spanish-language titles (SmartRecruiters MX, Personio, Workday LATAM)
    - ingeniero
    - ingeniera
    - desarrollador
    - desarrollo
    - programador
    - soluciones
    - datos
    - ia
  exclude:
    # disciplines that are not software engineering but still say "engineer"
    - mechanical
    - electrical
    - electronics
    - civil
    - chemical
    - industrial
    - manufacturing
    - "process engineer"
    - "process safety"
    - structural
    - aerospace
    - biomedical
    - petroleum
    - "field service"
    - maintenance
    - hvac
    - "test technician"
    - "quality engineer"
    - "quality assurance engineer"
    - metallurgy
    - "packaging engineer"
    - "plant engineer"
    - "facilities"
    # non-engineering functions
    - recruiter
    - recruiting
    - sourcer
    - "talent acquisition"
    - "account executive"
    - "account manager"
    - "sales development"
    - "sales representative"
    - "sales engineer"
    - "sales manager"
    - "customer success manager"
    - "customer support"
    - "customer service"
    - "support agent"
    - "support specialist"
    - accountant
    - accounting
    - bookkeeper
    - payroll
    - "human resources"
    - "people operations"
    - paralegal
    - attorney
    - counsel
    - nurse
    - physician
    - therapist
    - teacher
    - profesor
    - tutor
    - "warehouse"
