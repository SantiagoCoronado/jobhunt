# Which sources to pull. Aggregators need no setup and are ON by default.
# ATS tokens below were verified live (each returns real open jobs); the batch
# added 2026-08-27 was curl-checked for HTTP 200 + a non-empty jobs array.
# A shared `title_filter:` block at the bottom of this file gates every row on
# role family, so a broad board can be added without flooding triage.

# Aggregators (no tokens needed)
remoteok:
  enabled: true                    # attribution required (we keep the RemoteOK URL)
remotive:
  enabled: true
  limit: 100
  # No category filter: the WHOLE Remotive board was 18 live rows on 2026-08-27
  # (5 of them software), so narrowing it to software-dev bought nothing and the
  # source looked broken. One call a run; ToS asks for <=~4 calls/day.
  categories: []
weworkremotely:
  enabled: true
  categories:
    - remote-programming-jobs      # the catch-all feed, added 2026-08-27
    - remote-back-end-programming-jobs
    - remote-full-stack-programming-jobs
    - remote-front-end-programming-jobs
    - remote-devops-sysadmin-jobs
hackernews:
  enabled: true                    # monthly "Who is Hiring" thread
getonbrd:                          # LatAm / Mexico
  enabled: true
  per_page: 100
  pages: 3                         # the API paginates; the adapter used to read page 1 only
  queries:
    - "remote backend"
    - "machine learning"
    - "data engineer"
    - "ai engineer"
    - "applied ai"
    - "full stack"
    - "founding engineer"
    - "llm"
    - "python"
    - "react"
    - "node"
    - "typescript"
    - "solutions engineer"
    - "solutions architect"
    - "frontend"
    - "internal tools"
    - "developer experience"
    - "platform engineer"
    - "automation"
    - "ecommerce"                 # domain angle, set 2026-08-27
    - "marketplace"

jobicy:
  enabled: true
  count: 100
  # `ai` is NOT a valid Jobicy tag (the API 400s on it); machine-learning is.
  tags: [python, javascript, engineering, react, nodejs, typescript, dev,
         machine-learning, data, devops, frontend, backend, fullstack]
arbeitnow:
  enabled: true
  pages: 10                        # was 3; the feed goes much deeper
  remote_only: true
himalayas:
  enabled: true
  # `limit` is IGNORED server-side (always 20 rows); only `offset` moves. One
  # call therefore saw 20 of the board, which is why this source looked dead.
  pages: 30                        # x20 rows
posthog:                           # posthog.com/cool-tech-jobs, curated dev-tool boards, no key
  enabled: true
  pages: 3
  page_size: 100
  departments: []                  # [] = all; free-text field, match loosely (e.g. [Engineering, Data])
  remote_only: false
recruitee:                         # per-company (Recruitee ATS); add slugs then flip enabled
  enabled: false
  # 16 candidate slugs probed 2026-08-27 (productboard, pipedrive, aiven, wolt,
  # veriff, ...): every one 404s. Recruitee subdomains are not guessable from the
  # company name; capture a real one from a careers page before enabling.
  companies: []
smartrecruiters:                   # per-company; list endpoint has no description (title-only match)
  enabled: false
  companies: []

# Company ATS boards (verified tokens). AI-forward + remote/LatAm-friendly first.
greenhouse:
  enabled: true
  tokens: [anthropic, gitlab, vercel, mercury, clara, nubank, planetscale, scaleai, bitso, netlify, lovable, brex, cresta, fal, assemblyai, warp, labelbox, prisma, clickhouse, grafanalabs, tailscale, descript, cockroachlabs, knock, typeface, imbue, bold, hightouch, fivetran, webflow, galileo, turing, backblaze]
lever:
  enabled: true
  companies: [mistral, kavak, yuno, neon, xepelin, fintual, dlocal, anyscale]
ashby:
  enabled: true
  clients: [openai, harvey, elevenlabs, cohere, ramp, plaid, notion, replit, baseten, deepgram, writer, supabase, sentry, perplexity, linear, render, posthog, zapier, airbyte, railway, sierra, resend, belvo, reka, pinecone, gorgias, weaviate, modal, browserbase, temporal, abridge, crusoe, langchain, synthesia, kueski, decagon, braintrust, tavus, cerebras, langfuse, vapi, bland, openevidence, mercor, workos, stytch, coder, 1password, runpod, poolside, suno, doppler, cognition, gamma, inngest, zed, windmill, infisical, prefect, astronomer, nomic, distyl, cluely, clickup, character, artisan, julius, granola, andela, vellum, motherduck, sardine]
workable:
  enabled: false
  # Probed 2026-08-27: apply.workable.com/api/v1/widget/accounts/<slug> now answers
  # with a Cloudflare "Security challenge" HTML page (HTTP 200, not JSON) for every
  # slug tried, so there is nothing safe to parse. Leave off.
  accounts: []

# ---------------------------------------------------------------------------
# New sources (docs/new-sources.md). Keys live in .env (copy .env.example).
# ---------------------------------------------------------------------------

# Aggregators (on by default; keyed ones skip cleanly until their key is in .env)
adzuna:                            # Mexico + 12 countries; needs ADZUNA_APP_ID / ADZUNA_APP_KEY
  enabled: true
  # `countries:` replaces the old single `country:`. Adzuna allows ~250 calls/day;
  # this config spends ~90 (18 MX queries x 3 pages + 10 US queries x 3 pages).
  countries: [mx, us]
  pages: 3
  results_per_page: 50
  queries:                         # used for MX
    - "ai engineer"
    - "applied ai"
    - "machine learning"
    - "backend"
    - "full stack"
    - "founding engineer"
    - "data engineer"
    - "python"
    - "react"
    - "typescript"
    - "frontend developer"
    - "internal tools"
    - "developer experience"
    - "solutions engineer"
    - "solutions architect"
    - "platform engineer"
    - "ecommerce developer"       # domain angle, set 2026-08-27
    - "marketplace engineer"
  country_queries:
    # US roles are only in scope when they hire remotely (profile.location_rule),
    # and `where=remote` returns 0, so "remote" goes in the free-text query.
    us:
      - "remote ai engineer"
      - "remote applied ai engineer"
      - "remote forward deployed engineer"
      - "remote founding engineer"
      - "remote full stack engineer"
      - "remote frontend engineer"
      - "remote react engineer"
      - "remote solutions engineer"
      - "remote internal tools engineer"
      - "remote developer experience engineer"
themuse:                           # US/global tech; works anon, THEMUSE_API_KEY optional
  enabled: true
  # Was pages: 3, i.e. 60 of the 1,196 rows behind the Software Engineering +
  # Flexible/Remote filter. 25 pages x 20 rows x 2 categories is the real depth.
  pages: 25
  locations:
    - "Flexible / Remote"
    - "Mexico City, Mexico"
    - "Guadalajara, Mexico"
    - "Monterrey, Mexico"
  categories:
    - "Software Engineering"
    - "Data and Analytics"
findwork:                          # remote/tech; needs FINDWORK_TOKEN
  enabled: true
  remote: true
  # 2 not 3: findwork's undocumented limiter starts 429ing past ~30 requests a
  # run, and the backoff sleeps were the single biggest cost of the discover run.
  pages: 2
  search:
    - "ai engineer"
    - "applied ai"
    - "machine learning"
    - "backend"
    - "full stack"
    - "frontend"
    - "react"
    - "typescript"
    - "internal tools"
    - "developer experience"
    - "solutions engineer"
    - "founding engineer"
    - "platform engineer"
    - "ecommerce"                 # domain angle, set 2026-08-27
    - "marketplace"
softserve:                         # SoftServe own careers board (SEO sitemap + JSON-LD JobPosting; no key)
  enabled: true
  workers: 8
  countries: [Mexico, Brazil, Colombia, Argentina, Chile, Peru, Costa Rica, Uruguay]

torre:                             # remote-LATAM depth (grey-zone public JSON, no key)
  enabled: true
  size: 20                         # endpoint 400s above ~30 per page
  pages: 3
  remote: true
  queries:
    - "software engineer"
    - "ai engineer"
    - "applied ai engineer"
    - "machine learning engineer"
    - "backend engineer"
    - "full stack engineer"
    - "founding engineer"
    - "frontend engineer"
    - "react engineer"
    - "internal tools engineer"
    - "developer experience engineer"
    - "platform engineer"
    - "solutions engineer"
    - "solutions architect"
    - "forward deployed engineer"
    - "automation engineer"
    - "ecommerce engineer"        # domain angle, set 2026-08-27
careerjet:                         # Mexico via es_MX; uses CAREERJET_AFFID (verified live)
  enabled: true
  locale_code: es_MX
  location: Mexico
  pagesize: 50
  pages: 5                         # response reports ~25 pages for a broad keyword
  keywords:
    - "developer"
    - "ingeniero de software"
    - "desarrollador"
    - "machine learning"
    - "inteligencia artificial"
    - "backend"
    - "frontend"
    - "react"
    - "python"
    - "full stack"
    - "solutions engineer"
    - "devops"

# Net-new ATS platforms (curate slugs, then flip enabled - like recruitee)
personio:                          # EU startups; XML feed, no key
  enabled: false
  # 14 slugs probed 2026-08-27; only `personio` (1 role) and `orderbird` (5) answer,
  # and neither is remote-LATAM. Not worth a request per run yet.
  companies: []                    # e.g. [personio]  ->  {company}.jobs.personio.de/xml
bamboohr:                          # net-new company coverage; no key
  enabled: false
  # 20 remote-first slugs probed 2026-08-27 (close, doist, buffer, zapier, ...):
  # every one either NXDOMAINs or returns an empty result array.
  companies: []                    # e.g. [close]  ->  {company}.bamboohr.com/careers/list
workday:                           # large enterprises on Workday CxS (POST, no key)
  enabled: true
  limit: 20
  pages: 3
  sites: []                        # e.g. [{tenant: nvidia, wd: 5, site: NVIDIAExternalCareerSite}]

# Grey-zone boards (need endpoint/session work before they return rows)
consider:                          # VC talent boards; client-rendered, endpoint not yet captured
  enabled: false
  boards: []                       # e.g. [sequoia-capital]
workatastartup:                    # YC WaaS; job API needs a browser session (406 otherwise)
  enabled: false

# Grey-zone gap filler (OFF by default, read the README before enabling)
# jobspy:  # scrapes Indeed/LinkedIn; breaks often, ToS risk, needs proxies for LinkedIn
#   enabled: false

# ---------------------------------------------------------------------------
# Shared role-family title gate for the broad company ATS boards
# (greenhouse / lever / ashby / smartrecruiters / recruitee / bamboohr /
# personio / workday). Those boards hand back every open req a company has, so
# roughly half of what they returned was nursing, manufacturing, or sales, and
# each junk row costs a Haiku triage call. Terms match on WORD BOUNDARIES, so
# "ai" matches "AI Engineer" but not "Maintenance"; add hyphenated spellings
# explicitly. Titles only: location is never filtered here (config/profile.yaml
# `location_rule` is the single authority, and the matcher applies it).
# Per-source override: give that source its own `title_filter:` block, or
# `title_filter: {enabled: false}` to take everything.
# ---------------------------------------------------------------------------
title_filter:
  enabled: true
  include:
    # generic engineering
    - engineer
    - engineering
    - developer
    - development
    - programmer
    - architect
    - software
    - swe
    - technologist
    # Family A, AI / full stack
    - ai
    - a.i.
    - ml
    - llm
    - genai
    - "machine learning"
    - "deep learning"
    - "artificial intelligence"
    - "data science"
    - "data scientist"
    - "research scientist"
    - "full stack"
    - fullstack
    - "full-stack"
    - backend
    - "back-end"
    - "back end"
    - founding
    # Family B, deployment / enablement / solutions / GTM
    - solutions
    - solution
    - "forward deployed"
    - "forward-deployed"
    - deployment
    - strategist
    - enablement
    - adoption
    - transformation
    - gtm
    - "go-to-market"
    - "customer engineer"
    - "field engineer"
    - "technical account"
    - "technical program"
    - "technical product"
    - "technical lead"
    - "technical consultant"
    - consultant
    - "professional services"
    # Family C, frontend / web
    - frontend
    - "front-end"
    - "front end"
    - ui
    - ux
    - web
    - react
    - javascript
    - typescript
    - mobile
    - "design engineer"
    # Family D, internal tools / platform / devex
    - "internal tools"
    - "internal tooling"
    - "developer experience"
    - "developer productivity"
    - "developer relations"
    - devrel
    - devex
    - platform
    - infrastructure
    - infra
    - devops
    - sre
    - "site reliability"
    - automation
    - integrations
    - integration
    - "business systems"
    - "data engineer"
    - "analytics engineer"
    - python
    - node
    - "cloud engineer"
    - api
    # Spanish-language titles (SmartRecruiters MX, Personio, Workday LATAM)
    - ingeniero
    - ingeniera
    - desarrollador
    - desarrollo
    - programador
    - soluciones
    - datos
    - ia
  exclude:
    # disciplines that are not software engineering but still say "engineer"
    - mechanical
    - electrical
    - electronics
    - civil
    - chemical
    - industrial
    - manufacturing
    - "process engineer"
    - "process safety"
    - structural
    - aerospace
    - biomedical
    - petroleum
    - "field service"
    - maintenance
    - hvac
    - "test technician"
    - "quality engineer"
    - "quality assurance engineer"
    - metallurgy
    - "packaging engineer"
    - "plant engineer"
    - "facilities"
    # non-engineering functions
    - recruiter
    - recruiting
    - sourcer
    - "talent acquisition"
    - "account executive"
    - "account manager"
    - "sales development"
    - "sales representative"
    - "sales engineer"
    - "sales manager"
    - "customer success manager"
    - "customer support"
    - "customer service"
    - "support agent"
    - "support specialist"
    - accountant
    - accounting
    - bookkeeper
    - payroll
    - "human resources"
    - "people operations"
    - paralegal
    - attorney
    - counsel
    - nurse
    - physician
    - therapist
    - teacher
    - profesor
    - tutor
    - "warehouse"
    - driver
    - cajero
    - vendedor
    - asesor
    - enfermer
