# Which sources to pull. Aggregators need no setup and are ON by default.
# ATS tokens below were verified live (each returns real open jobs); the batch
# added 2026-08-27 was curl-checked for HTTP 200 + a non-empty jobs array.
# A shared `title_filter:` block at the bottom of this file gates every row on
# role family, so a broad board can be added without flooding triage.

# Aggregators (no tokens needed)
remoteok:
  enabled: true                    # attribution required (we keep the RemoteOK URL)
remotive:
  enabled: true
  limit: 100
  # No category filter: the WHOLE Remotive board was 18 live rows on 2026-08-27
  # (5 of them software), so narrowing it to software-dev bought nothing and the
  # source looked broken. One call a run; ToS asks for <=~4 calls/day.
  categories: []
weworkremotely:
  enabled: true
  categories:
    - remote-programming-jobs      # the catch-all feed, added 2026-08-27
    - remote-back-end-programming-jobs
    - remote-full-stack-programming-jobs
    - remote-front-end-programming-jobs
    - remote-devops-sysadmin-jobs
    - remote-product-jobs
hackernews:                        # monthly "Who is Hiring" thread, via HN's Algolia API
  enabled: true
  months: 3                        # walk this many monthly threads
  pages: 6                         # x100 comments each
  # HN ad "titles" are company names ("Acme", "FusionAuth"), not role titles, so
  # the shared role-family gate would drop ~80% of real ads. Off for this source.
  title_filter: {enabled: false}
getonbrd:                          # LatAm boards; queries come from sources.local.yaml
  enabled: true
  per_page: 100
  pages: 3                         # the API paginates; the adapter used to read page 1 only
jobicy:
  enabled: true
  count: 100
  # `ai` is NOT a valid Jobicy tag (the API 400s on it); machine-learning is.
arbeitnow:
  enabled: true
  pages: 10                        # was 3; the feed goes much deeper
  remote_only: true
himalayas:
  enabled: true
  # `limit` is IGNORED server-side (always 20 rows); only `offset` moves. One
  # call therefore saw 20 of the board, which is why this source looked dead.
  pages: 30                        # x20 rows
posthog:                           # posthog.com/cool-tech-jobs, curated dev-tool boards, no key
  enabled: true
  pages: 3
  page_size: 100
  departments: []                  # [] = all; free-text field, match loosely (e.g. [Engineering, Data])
  remote_only: false
recruitee:                         # per-company (Recruitee ATS); add slugs then flip enabled
  enabled: false
  # 16 candidate slugs probed 2026-08-27 (productboard, pipedrive, aiven, wolt,
  # veriff, ...): every one 404s. Recruitee subdomains are not guessable from the
  # company name; capture a real one from a careers page before enabling.
  companies: []
smartrecruiters:                   # per-company; list endpoint has no description (title-only match)
  enabled: true
  # Verified 2026-08-27. Endava is a LATAM/EU delivery shop that hires remote in
  # Mexico. BoschGroup also answers (4,809 rows) but is overwhelmingly Spanish-
  # language manufacturing; deliberately left out.
# Company ATS boards. Tokens, company lists and display names live in config/sources.local.yaml.
greenhouse:
  enabled: true
  # Display names for tokens whose Title()-cased slug is not the company name. Matters
  # for dream companies: a hand-entered row (`query add`) and the ATS row must share a canonical_key.
lever:
  enabled: true
  # mistral answers 200 with an empty list right now (board between postings); kept.
ashby:
  enabled: true
  # fal-ai: fal.ai moved off Greenhouse (token 'fal' 404s) onto Ashby, slug
  # verified 2026-08-27 via fal.ai/careers -> jobs.ashbyhq.com/fal-ai (31 jobs live).
  # windmill and vellum dropped 2026-08-27: both posting-api 404 now. windmill.dev/careers
  # has no ATS board at all (just a "send general application" mailto). vellum.ai/careers
  # renders a jobs.ashbyhq.com/vellum page but the public posting-api 404s (no live postings
  # exposed via API); re-add if they reopen a public board.
  # nubank: its Greenhouse token now returns 0 jobs; the live board is here (120 roles).
workable:
  enabled: false
  # Probed 2026-08-27: apply.workable.com/api/v1/widget/accounts/<slug> now answers
  # with a Cloudflare "Security challenge" HTML page (HTTP 200, not JSON) for every
  # slug tried, so there is nothing safe to parse. Leave off.
  accounts: []

# ---------------------------------------------------------------------------
# New sources (docs/history/new-sources.md). Keys live in .env (copy .env.example).
# ---------------------------------------------------------------------------

# Aggregators (on by default; keyed ones skip cleanly until their key is in .env)
adzuna:                            # countries + queries from sources.local.yaml; needs ADZUNA_APP_ID / ADZUNA_APP_KEY
  enabled: true
  # `countries:` replaces the old single `country:`. Adzuna allows ~250 calls/day;
  # this config spends ~90 (18 MX queries x 3 pages + 10 US queries x 3 pages).
  pages: 3
  results_per_page: 50
themuse:                           # US/global tech; works anon, THEMUSE_API_KEY optional
  enabled: true
  # Was pages: 3, i.e. 60 of the 1,196 rows behind the Software Engineering +
  # Flexible/Remote filter. 25 pages x 20 rows x 2 categories is the real depth.
  pages: 25
findwork:                          # remote/tech; needs FINDWORK_TOKEN
  enabled: true
  remote: true
  # 2 not 3: findwork's undocumented limiter starts 429ing past ~30 requests a
  # run, and the backoff sleeps were the single biggest cost of the discover run.
  pages: 2
softserve:                         # SoftServe own careers board (SEO sitemap + JSON-LD JobPosting; no key)
  enabled: true
  workers: 8
torre:                             # remote-LATAM depth (grey-zone public JSON, no key); queries from sources.local.yaml
  enabled: true
  size: 20                         # endpoint 400s above ~30 per page
  pages: 3
  remote: true
careerjet:                         # locale + location from sources.local.yaml; uses CAREERJET_AFFID (verified live)
  enabled: true
  pagesize: 50
  pages: 5                         # response reports ~25 pages for a broad keyword
# Net-new ATS platforms (curate slugs, then flip enabled - like recruitee)
personio:                          # EU startups; XML feed, no key
  enabled: false
  # 14 slugs probed 2026-08-27; only `personio` (1 role) and `orderbird` (5) answer,
  # and neither is remote-LATAM. Not worth a request per run yet.
  companies: []                    # e.g. [personio]  ->  {company}.jobs.personio.de/xml
bamboohr:                          # net-new company coverage; no key
  enabled: false
  # 20 remote-first slugs probed 2026-08-27 (close, doist, buffer, zapier, ...):
  # every one either NXDOMAINs or returns an empty result array.
  companies: []                    # e.g. [close]  ->  {company}.bamboohr.com/careers/list
workday:                           # large enterprises on Workday CxS (POST, no key)
  enabled: true
  limit: 20
  pages: 5
  # Verified 2026-08-27 (POST returns a jobPostings array). The list endpoint has
  # no description text, so these rows match on title + location only; `search`
  # keeps each tenant's slice engineering-shaped.
teamtailor:                        # per-company JSON Feed ({slug}.teamtailor.com/jobs.json), no key
  enabled: false
  # `companies:` (tenant slugs, the {slug} in {slug}.teamtailor.com) live in
  # config/sources.local.yaml. Verified 2026-09-01: full descriptions, schema.org locations.
pinpoint:                          # Pinpoint ATS, {subdomain}.pinpointhq.com/postings.json, no key
  enabled: false
rippling:                          # Rippling ATS public board API, no key
  enabled: false
secretlab:                         # Secretlab's in-house openings API (single company), no key
  enabled: false                    # single-company adapter, verified 2026-09-01 (19 rows)

# Grey-zone boards (need endpoint/session work before they return rows)
consider:                          # VC talent boards; client-rendered, endpoint not yet captured
  enabled: false
  boards: []                       # e.g. [sequoia-capital]
workatastartup:                    # YC WaaS; job API needs a browser session (406 otherwise)
  enabled: false

# Grey-zone gap filler (OFF by default, read the README before enabling)
# jobspy:  # scrapes Indeed/LinkedIn; breaks often, ToS risk, needs proxies for LinkedIn
#   enabled: false

# ---------------------------------------------------------------------------
# Shared role-family title gate for the broad company ATS boards
# (greenhouse / lever / ashby / smartrecruiters / recruitee / bamboohr /
# personio / workday). Those boards hand back every open req a company has, so
# roughly half of what they returned was nursing, manufacturing, or sales, and
# each junk row costs a Haiku triage call. Terms match on WORD BOUNDARIES, so
# "ai" matches "AI Engineer" but not "Maintenance"; add hyphenated spellings
# explicitly. Titles only: location is never filtered here (config/profile.yaml
# `location_rule` is the single authority, and the matcher applies it).
# Per-source override: give that source its own `title_filter:` block, or
# `title_filter: {enabled: false}` to take everything.
# ---------------------------------------------------------------------------
title_filter:
  enabled: true
  # Dream companies (the dream_companies table) skip the gate entirely: their boards
  # are small (a few hundred rows) and the titles worth chasing there ("Member of Technical
  # Staff", "Head of Data Intelligence") are exactly the ones a keyword gate drops.
  skip_dream_companies: true
  include:
    # generic engineering
    - engineer
    - engineering
    - developer
    - development
    - programmer
    - architect
    - software
    - swe
    - technologist
    - "tech lead"
    - "technical lead"
    # languages and runtimes: a title that names one is an engineering title
    - python
    - javascript
    - typescript
    - java
    - golang
    - rust
    - ruby
    - kotlin
    - swift
    - scala
    - php
    - node
    - react
    - ".net"
    - "c++"
    - "c#"
    # Spanish-language titles (SmartRecruiters MX, Personio, Workday LATAM)
    - ingeniero
    - ingeniera
    - desarrollador
    - desarrollo
    - programador
    - soluciones
    - datos
    - ia
  exclude:
    # disciplines that are not software engineering but still say "engineer"
    - mechanical
    - electrical
    - electronics
    - civil
    - chemical
    - industrial
    - manufacturing
    - "process engineer"
    - "process safety"
    - structural
    - aerospace
    - biomedical
    - petroleum
    - "field service"
    - maintenance
    - hvac
    - "test technician"
    - "quality engineer"
    - "quality assurance engineer"
    - metallurgy
    - "packaging engineer"
    - "plant engineer"
    - "facilities"
    # non-engineering functions
    - recruiter
    - recruiting
    - sourcer
    - "talent acquisition"
    - "account executive"
    - "account manager"
    - "sales development"
    - "sales representative"
    - "sales engineer"
    - "sales manager"
    - "customer success manager"
    - "customer support"
    - "customer service"
    - "support agent"
    - "support specialist"
    - accountant
    - accounting
    - bookkeeper
    - payroll
    - "human resources"
    - "people operations"
    - paralegal
    - attorney
    - counsel
    - nurse
    - physician
    - therapist
    - teacher
    - profesor
    - tutor
    - "warehouse"
    - driver
    - cajero
    - vendedor
    - asesor
    - enfermer
