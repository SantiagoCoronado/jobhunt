# Which sources to pull. Aggregators need no setup and are ON by default.
# ATS tokens below were verified live on 2026-07-01 (each returns real open jobs).

# Aggregators (no tokens needed)
remoteok:
  enabled: true                    # attribution required (we keep the RemoteOK URL)
remotive:
  enabled: true
  limit: 100
  categories: [software-dev]       # ToS: <=~4 calls/day
weworkremotely:
  enabled: true
  categories:
    - remote-back-end-programming-jobs
    - remote-full-stack-programming-jobs
    - remote-front-end-programming-jobs
    - remote-devops-sysadmin-jobs
hackernews:
  enabled: true                    # monthly "Who is Hiring" thread
getonbrd:                          # LatAm / Mexico
  enabled: true
  per_page: 100
  queries:
    - "remote backend"
    - "machine learning"
    - "data engineer"
    - "ai engineer"
    - "full stack"
    - "founding engineer"
    - "llm"
    - "python"
    - "react"
    - "node"
    - "typescript"
    - "solutions engineer"
    - "frontend"
    - "internal tools"

jobicy:
  enabled: true
  count: 100
  tags: [python, javascript, engineering]
arbeitnow:
  enabled: true
  pages: 3
  remote_only: true
himalayas:
  enabled: true
  limit: 100
recruitee:                         # per-company (Recruitee ATS); add slugs then flip enabled
  enabled: false
  companies: []
smartrecruiters:                   # per-company; list endpoint has no description (title-only match)
  enabled: false
  companies: []

# Company ATS boards (verified tokens). AI-forward + remote/LatAm-friendly first.
greenhouse:
  enabled: true
  tokens: [anthropic, gitlab, vercel, mercury, clara, nubank, planetscale, scaleai, bitso, netlify, lovable, brex, cresta, fal, assemblyai, warp, labelbox, prisma, clickhouse, grafanalabs, tailscale, descript, cockroachlabs, knock, typeface, imbue, bold, hightouch, fivetran, webflow, galileo, turing, backblaze]
lever:
  enabled: true
  companies: [mistral, kavak, yuno, neon, xepelin, fintual, dlocal, anyscale]
ashby:
  enabled: true
  clients: [openai, harvey, elevenlabs, cohere, ramp, plaid, notion, replit, baseten, deepgram, writer, supabase, sentry, perplexity, linear, render, posthog, zapier, airbyte, railway, sierra, resend, belvo, reka, pinecone, gorgias, weaviate, modal, browserbase, temporal, abridge, crusoe, langchain, synthesia, kueski, decagon, braintrust, tavus, cerebras, langfuse, vapi, bland, openevidence, mercor, workos, stytch, coder, 1password, runpod, poolside, suno, doppler, cognition, gamma, inngest, zed, windmill, infisical, prefect, astronomer, nomic, distyl, cluely, clickup, character, artisan, julius, granola, andela, vellum, motherduck, sardine]
workable:
  enabled: false                   # EXPERIMENTAL schema varies
  accounts: []

# ---------------------------------------------------------------------------
# New sources (docs/new-sources.md). Keys live in .env (copy .env.example).
# ---------------------------------------------------------------------------

# Aggregators (on by default; keyed ones skip cleanly until their key is in .env)
adzuna:                            # Mexico + 12 countries; needs ADZUNA_APP_ID / ADZUNA_APP_KEY
  enabled: true
  country: mx
  pages: 2
  results_per_page: 50
  queries:
    - "ai engineer"
    - "machine learning"
    - "backend"
    - "full stack"
    - "founding engineer"
    - "data engineer"
    - "python"
    - "frontend developer"
    - "internal tools"
themuse:                           # US/global tech; works anon, THEMUSE_API_KEY optional
  enabled: true
  pages: 3
  locations: ["Flexible / Remote"]
  categories:
    - "Software Engineering"
    - "Data Science"
    - "Data and Analytics"
findwork:                          # remote/tech; needs FINDWORK_TOKEN
  enabled: true
  remote: true
  pages: 2
  search:
    - "ai engineer"
    - "machine learning"
    - "backend"
    - "full stack"
    - "frontend"
    - "internal tools"
softserve:                         # SoftServe own careers board (SEO sitemap + JSON-LD JobPosting; no key)
  enabled: true
  workers: 8
  countries: [Mexico, Brazil, Colombia, Argentina, Chile, Peru, Costa Rica, Uruguay]

torre:                             # remote-LATAM depth (grey-zone public JSON, no key)
  enabled: true
  size: 20                         # endpoint 400s above ~30 per page
  pages: 2
  remote: true
  queries:
    - "software engineer"
    - "ai engineer"
    - "machine learning engineer"
    - "backend engineer"
    - "full stack engineer"
    - "founding engineer"
    - "frontend engineer"
    - "internal tools engineer"
careerjet:                         # Mexico via es_MX; uses CAREERJET_AFFID (verified live)
  enabled: true
  locale_code: es_MX
  location: Mexico
  pagesize: 50
  keywords: ["developer", "ingeniero de software", "machine learning", "backend", "frontend"]

# Net-new ATS platforms (curate slugs, then flip enabled - like recruitee)
personio:                          # EU startups; XML feed, no key
  enabled: false
  companies: []                    # e.g. [personio]  ->  {company}.jobs.personio.de/xml
bamboohr:                          # net-new company coverage; no key
  enabled: false
  companies: []                    # e.g. [close]  ->  {company}.bamboohr.com/careers/list
workday:                           # large enterprises on Workday CxS (POST, no key)
  enabled: false
  limit: 20
  pages: 3
  sites: []                        # e.g. [{tenant: nvidia, wd: 5, site: NVIDIAExternalCareerSite}]

# Grey-zone boards (need endpoint/session work before they return rows)
consider:                          # VC talent boards; client-rendered, endpoint not yet captured
  enabled: false
  boards: []                       # e.g. [sequoia-capital]
workatastartup:                    # YC WaaS; job API needs a browser session (406 otherwise)
  enabled: false

# Grey-zone gap filler (OFF by default, read the README before enabling)
# jobspy:  # scrapes Indeed/LinkedIn; breaks often, ToS risk, needs proxies for LinkedIn
#   enabled: false
