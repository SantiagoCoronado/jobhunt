# Product data: where in the world a posting's location string points (docs/spec-open-source.md
# decision 7). Nothing here is about one user; WHICH region is home comes from
# config/profile.yaml (`header_location`, `work_authorization.relocation_regions`).
#
# One entry per region. `aliases` are the country or region words, `cities` the city words
# (both matched on word boundaries, lowercase), `codes` the two-letter codes a city is written
# with after a comma ("Berlin, DE") that collide with a US state code, `within` the regions this
# one belongs to (mexico is within latam, north america and americas), so a posting scoped to a
# containing region ("Remote LATAM") counts as reachable from that home. The `united states`
# entry also carries its state codes and names, which the classifier treats as US words.
#
# Read by src/geo.py: the tailor build and the star pick use it to tell a dream-company row
# inside the candidate's relocation regions from one outside them, the match export's
# `--eligible-only` prefilter uses it to drop rows clearly locked to another region, and
# `python -m src.geo "<location>"` prints what a string resolves to.

regions:
  americas:
    aliases: [americas]
  north america:
    aliases: [north america]
    within: [americas]
  latam:
    aliases: [latam, latin america, latinoamerica, latinoamérica]
    within: [americas]
  united states:
    aliases: [us, usa, u.s., u.s.a., united states, us remote, remote us, us-remote, remote (us)]
    cities: [san francisco, sf, nyc, new york city, brooklyn, palo alto, mountain view, san jose,
             sunnyvale, foster city, seattle, austin, boston, chicago, denver, los angeles,
             san diego, atlanta, miami, dallas, houston, phoenix, portland, philadelphia,
             pittsburgh, detroit, minneapolis, salt lake city, d.c., bay area, silicon valley]
    within: [north america]
    state_codes: [al, ak, az, ar, ca, co, ct, de, fl, ga, hi, id, il, in, ia, ks, ky, la, me, md,
                  ma, mi, mn, ms, mo, mt, ne, nv, nh, nj, nm, ny, nc, nd, oh, ok, or, pa, ri, sc,
                  sd, tn, tx, ut, vt, va, wa, wv, wi, wy, dc]
    state_names: [alabama, alaska, arizona, arkansas, california, colorado, connecticut, delaware,
                  florida, georgia, hawaii, idaho, illinois, indiana, iowa, kansas, kentucky,
                  louisiana, maine, maryland, massachusetts, michigan, minnesota, mississippi,
                  missouri, montana, nebraska, nevada, new hampshire, new jersey, new mexico,
                  new york, north carolina, north dakota, ohio, oklahoma, oregon, pennsylvania,
                  rhode island, south carolina, south dakota, tennessee, texas, utah, vermont,
                  virginia, washington, west virginia, wisconsin, wyoming]
  canada:
    aliases: [canada]
    cities: [toronto, vancouver, montreal]
    within: [north america]
  mexico:
    aliases: [mexico, méxico, mx, cdmx]
    cities: [mexico city, ciudad de mexico, ciudad de méxico, guadalajara, monterrey]
    within: [latam, north america]
  brazil:
    aliases: [brazil, brasil]
    cities: [sao paulo, são paulo, rio de janeiro]
    within: [latam]
  argentina:
