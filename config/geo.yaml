    aliases: [americas]
  north america:
    aliases: [north america]
    within: [americas]
  latam:
    aliases: [latam, latin america, latinoamerica, latinoamérica]
    within: [americas]
  united states:
    aliases: [us, usa, u.s., u.s.a., united states, us remote, remote us, us-remote, remote (us)]
    cities: [san francisco, sf, nyc, new york city, brooklyn, palo alto, mountain view, san jose,
             sunnyvale, santa clara, foster city, seattle, austin, boston, chicago, denver, los angeles,
             san diego, atlanta, miami, dallas, houston, phoenix, portland, philadelphia,
             pittsburgh, detroit, minneapolis, salt lake city, d.c., bay area, silicon valley]
    within: [north america]
    state_codes: [al, ak, az, ar, ca, co, ct, de, fl, ga, hi, id, il, in, ia, ks, ky, la, me, md,
                  ma, mi, mn, ms, mo, mt, ne, nv, nh, nj, nm, ny, nc, nd, oh, ok, or, pa, ri, sc,
