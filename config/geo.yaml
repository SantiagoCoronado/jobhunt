# Product data: where in the world a posting's location string points (docs/spec-open-source.md
# decision 7). Nothing here is about one user; WHICH region is home comes from
# config/profile.yaml (`header_location`, `work_authorization.relocation_regions`).
#
# One entry per region. `aliases` are the country or region words, `cities` the city words
# (both matched on word boundaries, lowercase), `codes` the two-letter codes a city is written
# with after a comma ("Berlin, DE") that collide with a US state code, `states` the sub-national
# names (Mexican states; the US ones are `state_names`, and `state_codes` the two-letter codes
# that follow a comma), `within` the regions this one belongs to (mexico is within latam, north
# america and americas), so a posting scoped to a containing region ("Remote LATAM") counts as
# reachable from that home. Precedence (src/geo.py): a country or region word, then an explicit
# US state code after a comma, then a state name, then a city; between overlapping names the
# longest wins, so "Baja California" is Mexico and "Santa Fe, New Mexico" is the US.
#
# Read by src/geo.py: the tailor build and the star pick use it to tell a dream-company row
# inside the candidate's relocation regions from one outside them, the match export's
# `--eligible-only` prefilter uses it to drop rows clearly locked to another region, and
# `python -m src.geo "<location>"` prints what a string resolves to.

# A bare two-letter part that is a US state code names the US ("NY / SF / EMEA") unless it is
# one of these, which as a bare token far more often means the country: a bare "DE" is Germany,
# a bare "CA" is still California.
bare_state_codes_that_mean_a_country: [de, in, il, it, es, pt, at, be, pl, ie, ne]

regions:
