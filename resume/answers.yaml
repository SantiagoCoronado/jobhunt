  - id: spec-writing-experience
    question: "Could you describe your experience writing technical or business specifications? How do you ensure your specifications are clear and actionable for both technical and non-technical stakeholders?"
    answer: >
      Most of my spec writing comes from owning delivery end to end rather than a
      business analyst seat, and it happens at two levels. With clients, the spec starts
      as requirements gathering: at Eugenia.ai I onboarded HOAs and property
      administrators and translated conflicting, non-technical asks into the mobile and
      web apps we shipped, and Pragma AI engagements open with a diagnostic that turns a
      loose ask into a scoped system. For the build itself I write the spec before the
      code: outcome, constraints, and acceptance behavior, broken into epics and
      stories, each story shipped as its own PR with tests. On Pragma Brain the standing
      decisions live in 28 architecture decision records; when the no-answer gate was
      over-firing I traced it to chunking parameters and fed the fix back into those
      records. What keeps a spec readable for both audiences is stating requirements as
      observable behavior, what the user does and what the system visibly does in
      response, rather than implementation detail; a COO and a developer can both check
      the same sentence. I have not written formal BRDs inside a consultancy or an
      enterprise; the practice above is what I run.
