  - id: large-db-safe-migration
    question: "How would you modify/migrate a large production database without losing or corrupting data?"
    answer: >
      I treat it as expand and contract rather than one cutover. Add the new
      structure alongside the old one, dual-write to both, backfill the history in
      bounded batches, verify the backfill matches before anything reads from it,
      move reads over, and only then drop the old path. The properties that make it
      safe are that every step is reversible and the backfill is idempotent and
      resumable, so a worker that dies mid-run picks up where it stopped instead of
      double-writing. On Kairos I run a 23-table SQLite schema on versioned,
      append-only migrations, never editing an old one, with per-batch upserts so an
      interrupted job resumes cleanly. At Online Basics the same instinct was
      validation at the ingestion boundary across 10+ third-party APIs and 100K+
      daily data points on hourly sync, catching bad data before it reached the
      operators pricing against it rather than reconciling afterward. On a
      distributed store the shape changes: you create a new table for the new access
      pattern instead of altering one in place, migrate readers, and lean on quorum
      writes and idempotency because you do not get a transaction across partitions.
    draft: true   # the 2026-07-27 Backblaze HM round exposed this: I answered "caching," which is the wrong layer entirely. Rehearse this until it is reflex.

