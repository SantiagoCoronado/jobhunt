  - id: ai-workflow
    question: "How do you work with AI coding tools? / How do you scale yourself with AI?"
    answer: >
      I define what I want first, then have Claude produce a detailed spec we iterate
      on together. Big work becomes epics and stories; every story is its own PR. I
      review each PR myself and run review loops with a second, independent session:
      the first review finds a real bug about 90% of the time, each pass after that
      finds less, roughly a third less each round, and the loop ends when a full pass
      comes back clean. I require tests with every story (Vitest; Playwright when
      there's meaningful UI), and after merge I do manual QA on the actual
      functionality. The volume of generated code means line-by-line reading doesn't
      scale; the review loop, strong tests, and real QA are what keep me in command
      of the codebase.
    draft: false  # loop numbers and wording provided by Santiago 2026-08-24
