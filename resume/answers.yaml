  - id: speed-vs-quality
    question: "How do you balance speed versus quality?"
    answer: >
      In zero to one, iteration is the lever: build, test, rebuild in small versions
      instead of designing everything up front in meetings. I keep a floor under the
      speed: every story ships with tests, nothing merges until they are green, and I
      QA the feature myself on a testing branch before it reaches production. For AI
      behavior I gate changes on a labeled eval set instead of eyeballing outputs. So
      I move fast on scope and design, and hold the line on tests and QA.
