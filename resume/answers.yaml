  - id: structured-extraction-approach
    question: "How would you pull specific fields out of a document type at scale? / Which model would you pick for document extraction?"
    answer: >
      Extraction is a structured-output problem, not a retrieval one, so I would not put a
      vector database in this path at all. I define the target schema first, then call the
      model with that schema enforced, few-shot examples covering the formats the documents
      actually come in, and temperature 0 so the same document always yields the same
      record. Then validation per field: types and formats checked in code, an abstain path
      when the model is not confident rather than a guessed value, and a confidence
      threshold that routes a document to human review instead of into the database. I size
      the model down until accuracy drops, because on well-specified extraction the small
      fast models hold up: on a recent case Haiku and GPT-4o-mini were accurate on every
      document in my test set at a cost under a dollar per hundred documents. The part that
      matters more than the model is the labeled test set, so a prompt or model change can
      be measured instead of eyeballed.
    draft: true   # 2026-07-29 Citibanamex panel: the live answer routed a field-extraction question
                  # through vector search and nearest-neighbor, which is the wrong mechanism, even
                  # though the take-home did it correctly. Home-field question, badly described.
                  # Do NOT mention any client or bank case specifics; keep it at this level.

  - id: semantic-search-methods
    question: "What methodologies do you know for semantic search? / How does your retrieval layer work?"
    answer: >
      The retrieval side is embeddings plus an approximate nearest neighbor index, and the
      decisions that actually move quality are the ones around it. Chunking is the big one:
      on Pragma Brain the no-answer gate was firing on questions the corpus could answer,
      and the root cause was the chunking parameters, not the model or the prompt. It also
      runs multilingual ES/EN embeddings, since the corpus and the questions are not always
      in the same language. On top of that I would reach for metadata filtering so retrieval
      is scoped before it ranks, hybrid keyword plus dense retrieval when exact terms matter
      (product codes, legal references, names), and a reranker over the top candidates when
      precision at the top of the list is what is failing. RAG is the pattern that consumes
      all of this; it is not itself the retrieval method.
    draft: true   # 2026-07-29 Citibanamex panel: the live answer to this was one word, "RAG," and
                  # stopped. Worst answer-to-actual-knowledge ratio of the call. Note the hybrid /
                  # reranker sentence is phrased as what he WOULD reach for, not as shipped work.
                  # Keep it that way; only the chunking and ES/EN embeddings are built history.

  - id: llm-production-quality
    question: "How do you know an LLM system is still working correctly in production?"
    answer: >
      Three layers. Log every conversation and run an automated reviewer over them on a
      schedule, so a model is checking whether the exchanges hold together instead of a
      person reading samples. Thumbs up and down from the end user, which is the cheapest
      honest signal there is. And thumbs from the human agent on anything that got escalated,
      because that is where the failures concentrate. Underneath that, the thing that keeps
      it from drifting is a regression suite: a golden set of questions with expected
      behavior that runs on every prompt change and every model change, so a change that
      helps one case and breaks four is visible before it ships. The numbers I would put on
      a dashboard are groundedness on retrieval-backed answers, escalation and containment
      rate, p95 latency, and cost per conversation.
    draft: true   # 2026-07-29 Citibanamex panel: the three mechanisms were his strongest LLM answer,
                  # delivered live and unprompted. The regression-suite and metrics sentences are the
                  # vocabulary the panel was listening for and that he did not use.

