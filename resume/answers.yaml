  - id: pragma-brain-stack
    question: "What did you build Pragma Brain with? Which vector database, what tables, where hosted?"
    answer: >
      SQLite with the sqlite-vec extension as the vector store, self-hosted on the
      client's own hardware so their data never leaves their machine. One derived
      index over the corpus, rebuildable at any time and never authoritative; the
      source documents stay the truth. Around 15 typed tools the agent can call
      against the index and the connected channels (Slack, email, WhatsApp). The
      answering rules are written down as ADRs: below the similarity cutoff the
      system refuses instead of answering, and every answer must quote the snippets
      it came from. A nightly pass flags inconsistencies across channels.
    draft: true   # 2026-07-30 EasyAudit round 2: asked THREE times (what DB, where hosted, what
                  # tables) and the live answer was "the OpenAI API... or ANNX... I'm not sure."
