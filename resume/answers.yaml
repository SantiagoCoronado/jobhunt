                  # This version keeps the same belief with the safety net stated.

  - id: deployment-process
    question: "Walk me through your deployment process. / How do you ship to production?"
    answer: >
      I build and test locally first. Deploys run through Vercel connected to the
      GitHub repo: a production branch plus a testing branch that deploys to its own
      URL, where clients run QA with me and I fix what we find before anything ships.
      Once checks pass I merge to production; if something slips through, Vercel keeps
      previous deployments to roll back to. Databases live on Supabase or Turso for
      lighter projects and AWS (EC2, RDS) when they need more; heavier backends run in
      Docker (Plutus is fully Dockerized with Postgres, Redis, and Celery workers).
