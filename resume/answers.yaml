  - id: high-traffic-endpoint
    question: "How would you design an API endpoint that takes massive traffic without overloading the server?"
    answer: >
      I would separate protecting the edge from protecting the data store, because
      they fail differently. At the edge: horizontal instances behind a load
      balancer, rate limits and per-client quotas so one caller cannot starve the
      rest, and caching for anything read-heavy and repeatable. Behind it: connection
      pooling so traffic spikes do not exhaust database connections, and a queue with
      backpressure for anything that does not have to be synchronous, so load sheds
      as delay instead of as errors. Writes get idempotency keys so a client retrying
      a timeout does not double-apply. I have run the ingestion side of this at
      Online Basics, 10+ third-party APIs and 100K+ daily data points on hourly sync,
      where the constraint was other people's rate limits rather than my own, and on
      Plutus where nightly ingestion is idempotent specifically so a failed run can
      be replayed safely.
    draft: true   # proposed after a thin live answer (geographic routing only) on the 2026-08-03 Backblaze technical round

  - id: third-party-api-integrations
    question: "Tell me about your experience integrating third-party APIs. / How do you deal with unreliable external systems?"
    answer: >
      Online Basics ran on integrations. Inventory lived in Inflow, a small niche system
      with a thin, loosely documented API, and sales ran on Amazon, Mercado Libre, and
      Shopify, whose APIs are large and standardized. The hard part was trusting the
      data: endpoints disagreed with each other, so I built a validation layer that
      compared what each source reported, transformed everything into one schema, and
      only then loaded it into the React operations app the team used to set prices and
      move stock. That pipeline pulled 10+ APIs into 100K+ data points a day on hourly
      sync and replaced hours of manual reporting with minutes. I've hit most of the
      failure modes this shape has, so the guardrails and tests go in before the outage.
